server:
  port: 8190
spring:
  datasource:
    url: "jdbc:postgresql://localhost:5190/identifier-registry-db"
    username: "postgres"
    password: "secret"
  jpa:
    properties:
      hibernate:
        ddl-auto: create
  docker:
    compose:
      enabled: true
      file: compose.yml
jeap:
  monitor:
    prometheus:
      password: "{noop}test"
      user: "prometheus"

logging:
  level:
    ch.admin.bit.jeap: DEBUG
    ch.admin.bj.swiyu: DEBUG
